<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - Hotel Cancellation Prediction</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
    <link href="css/auth.css" rel="stylesheet">

    <script src="js/common.js"></script>
    <script>Auth.skipIfLoggedIn();</script>
</head>

<body class="auth-page">

<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" href="login.html">
            🏨 Hotel Cancellation Prediction
        </a>
    </div>
</nav>

<main class="auth-wrap">

    <div class="card auth-card">

        <div class="card-header bg-dark text-white">
            <h4 class="mb-1">Create Account</h4>
            <small>Register to start predicting and keep your own history</small>
        </div>

        <div class="card-body">

            <div id="formError" class="alert alert-danger d-none" role="alert"></div>

            <form id="registerForm" novalidate>

                <div class="mb-3">
                    <label for="name" class="form-label">Full name</label>
                    <input type="text" id="name" class="form-control"
                           autocomplete="name" maxlength="80" required autofocus>
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" id="email" class="form-control"
                           autocomplete="email" maxlength="120" required>
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" id="password" class="form-control"
                           autocomplete="new-password" minlength="8" required
                           aria-describedby="pwHelp">
                    <div id="pwHelp" class="form-text">At least 8 characters.</div>
                </div>

                <div class="mb-4">
                    <label for="confirm" class="form-label">Confirm password</label>
                    <input type="password" id="confirm" class="form-control"
                           autocomplete="new-password" required>
                </div>

                <button type="submit" id="submitBtn"
                        class="btn btn-primary w-100 btn-submit">
                    Create Account
                </button>

            </form>

            <p class="auth-switch mb-0">
                Already registered? <a href="login.html">Log in</a>
            </p>

        </div>
    </div>

</main>

<script src="js/auth_pages.js"></script>
</body>

</html>
