<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Hotel Cancellation Prediction</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
    <link href="css/auth.css" rel="stylesheet">

    <script src="js/common.js"></script>
    <script>Auth.skipIfLoggedIn();</script>
</head>

<body class="auth-page admin-page">

<main class="auth-wrap">

    <div class="card auth-card">

        <div class="card-header text-white">
            <h4 class="mb-1">Admin Login</h4>
            <small class="text-white-50">
                Hotel Cancellation Prediction - staff access only
            </small>
        </div>

        <div class="card-body">

            <div id="formError" class="alert alert-danger d-none" role="alert"></div>

            <form id="adminLoginForm" novalidate>

                <div class="mb-3">
                    <label for="email" class="form-label">Admin email</label>
                    <input type="email" id="email" class="form-control"
                           autocomplete="username" required autofocus>
                </div>

                <div class="mb-4">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" id="password" class="form-control"
                           autocomplete="current-password" required>
                </div>

                <button type="submit" id="submitBtn"
                        class="btn btn-primary w-100 btn-submit">
                    Log In as Admin
                </button>

            </form>

            <p class="auth-switch mb-0">
                Not an administrator? <a href="login.html">Customer login</a>
            </p>

        </div>
    </div>

</main>

<script src="js/auth_pages.js"></script>
</body>

</html>
