<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Login - Hotel Cancellation Prediction</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
    <link href="css/auth.css" rel="stylesheet">

    <script src="js/common.js"></script>
    <script>Auth.skipIfLoggedIn();</script>
</head>

<body class="auth-page">

<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" href="login.html">
            🏨 Hotel Cancellation Prediction
        </a>
    </div>
</nav>

<main class="auth-wrap">

    <div class="card auth-card">

        <div class="card-header bg-dark text-white">
            <h4 class="mb-1">Customer Login</h4>
            <small>Log in to predict booking cancellation risk</small>
        </div>

        <div class="card-body">

            <div id="formError" class="alert alert-danger d-none" role="alert"></div>

            <form id="loginForm" novalidate>

                <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" id="email" class="form-control"
                           autocomplete="email" required autofocus>
                </div>

                <div class="mb-4">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" id="password" class="form-control"
                           autocomplete="current-password" required>
                </div>

                <button type="submit" id="submitBtn"
                        class="btn btn-primary w-100 btn-submit">
                    Log In
                </button>

            </form>

            <p class="auth-switch mb-2">
                New here? <a href="register.html">Create an account</a>
            </p>

            <p class="auth-switch auth-note mb-0">
                Hotel staff? <a href="admin_login.html">Admin login</a>
            </p>

        </div>
    </div>

</main>

<script src="js/auth_pages.js"></script>
</body>

</html>
